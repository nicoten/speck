<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="/styles.css">
<style>
  html,body{margin:0;padding:0}
  .card{width:1200px;height:630px;background:var(--paper);color:var(--ink);
        padding:76px 80px;display:flex;flex-direction:column;justify-content:space-between}
  .card__mark{display:flex;align-items:center;gap:18px;font-family:var(--mono);
              font-weight:500;font-size:34px;letter-spacing:-0.01em}
  .card__mark img{width:72px;height:72px;border-radius:15px}
  .card__line{font-family:var(--mono);font-weight:500;font-size:66px;line-height:1.1;
              letter-spacing:-0.03em;margin:0;max-width:19ch}
  .card__foot{display:flex;align-items:baseline;justify-content:space-between;
              font-family:var(--mono);font-size:20px;color:var(--ink-muted)}
  .card__rail{display:flex;align-items:center;gap:10px}
  .card__dot{width:11px;height:11px;border-radius:50%;background:var(--accent)}
  .card__rule{width:64px;height:1px;background:var(--accent-border)}
</style></head>
<body><div class="card">
  <div class="card__mark"><img src="/icon-256.png" alt="">Specks</div>
  <h1 class="card__line">Run OpenSpec end to end, in one window.</h1>
  <div class="card__foot">
    <span class="card__rail"><span class="card__dot"></span><span class="card__rule"></span>
      <span class="card__dot"></span><span class="card__rule"></span>
      <span class="card__dot"></span><span class="card__rule"></span>
      <span class="card__dot"></span></span>
    <span>specks.nicotejera.com</span>
  </div>
</div></body></html>
