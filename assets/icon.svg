<!-- Speck's app icon: the step rail the sidebar is built around — ordered
     steps, the last one not yet reached. Drawn on Apple's macOS icon grid, an
     824px squircle centred in 1024px, so the shipped icon needs no masking.
     Weights are set so the marks still separate at 32px. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d1794f"/>
      <stop offset="1" stop-color="#a64f2c"/>
    </linearGradient>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#ground)"/>

  <!-- The rail stops at the top of the last dot, so the open ring reads clean. -->
  <rect x="495" y="250" width="34" height="424" fill="#f5f2e8"/>

  <circle cx="512" cy="250" r="100" fill="#f5f2e8"/>
  <circle cx="512" cy="512" r="100" fill="#f5f2e8"/>
  <circle cx="512" cy="774" r="84" fill="none" stroke="#f5f2e8" stroke-width="32"/>
</svg>
